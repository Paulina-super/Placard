<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi placar</title>
<meta name="theme-color" content="#1D2433">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Courier+Prime&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF2;--surface:#FFFFFF;--soft:#DFE3EA;--ink:#1D2433;--muted:#5B6376;--line:#C9CFDA;
  --accent:#3B4FA8;--accent-ink:#FFFFFF;--label:#1D2433;--label-ink:#E9ECF3;--warn:#A9471F;--ok:#2B7355;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161D;--surface:#1C2029;--soft:#242935;--ink:#E6E9F0;--muted:#9AA2B4;--line:#323949;
  --accent:#93A4F2;--accent-ink:#13161D;--label:#E6E9F0;--label-ink:#1C2029;--warn:#F08A5D;--ok:#6CC49A;}}
:root[data-theme="dark"]{
  --bg:#13161D;--surface:#1C2029;--soft:#242935;--ink:#E6E9F0;--muted:#9AA2B4;--line:#323949;
  --accent:#93A4F2;--accent-ink:#13161D;--label:#E6E9F0;--label-ink:#1C2029;--warn:#F08A5D;--ok:#6CC49A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{max-width:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:2.1rem;letter-spacing:-.02em}
h2{font-size:1.25rem}
h3{font-size:1.05rem;margin-bottom:.5rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack>*+*{margin-top:12px}

.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;font-size:1.3rem;width:40px;height:40px;border-radius:50%}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;box-shadow:0 6px 18px rgba(20,30,60,.25);z-index:5}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}

.label{display:inline-block;background:var(--label);color:var(--label-ink);font:12px/1.35 "Courier Prime",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:2px;outline:1px dashed color-mix(in srgb,var(--label-ink) 45%,transparent);outline-offset:-4px;max-width:100%}
.label.empty{background:transparent;color:var(--muted);outline-color:var(--line);text-transform:none;letter-spacing:0}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.summary button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:left}
.summary b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;line-height:1}
.summary span{font-size:.75rem;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
.summary button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:420px){.summary{grid-template-columns:repeat(2,1fr)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph{aspect-ratio:4/5;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;padding:6px}
.ph .sw{width:46%;aspect-ratio:1;border-radius:50%}
.card .nm{font-weight:600;font-size:.92rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .label{font-size:10.5px;padding:4px 7px;outline-offset:-3px}
.flag{font-size:.75rem;color:var(--warn)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;margin-top:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:transparent;padding:6px 2px;border-radius:10px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:1.25rem;line-height:1}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--soft)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line)}
.sheet-body{max-width:640px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.field{margin-top:18px}
.field>label,.field>.lb{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
.comp-row{display:grid;grid-template-columns:1fr 84px 40px;gap:6px;margin-bottom:6px}
.editor{background:repeating-conic-gradient(var(--soft) 0 25%,var(--surface) 0 50%) 0 0/20px 20px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;padding:8px;min-height:180px}
.editor canvas{max-width:100%;max-height:55vh;touch-action:manipulation}
.editor.tap canvas{cursor:crosshair}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.detail-img{background:var(--soft);border-radius:16px;display:grid;place-items:center;padding:16px;aspect-ratio:1}
.detail-img img{max-height:100%;object-fit:contain}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:.85rem}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.banner{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:12px}

.board{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1.1fr 1.1fr .6fr;grid-template-areas:"top side" "bottom side" "feet acc";gap:6px;aspect-ratio:3/4;background:var(--soft);border-radius:14px;padding:10px;max-width:420px}
.board.mini{padding:5px;gap:3px;border-radius:10px}
.board .z{display:flex;gap:4px;min-height:0;min-width:0;align-items:center;justify-content:center}
.board .z img,.board .z .sw{flex:1 1 0;min-width:0;height:100%;object-fit:contain}
.board .z .sw{border-radius:8px;max-height:60%}
.z-top{grid-area:top}.z-bottom{grid-area:bottom}.z-side{grid-area:side;flex-direction:column}.z-feet{grid-area:feet}.z-acc{grid-area:acc}
.board.one-piece .z-top{grid-row:1/3}.board.one-piece .z-bottom{display:none}
.carousel{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.pick{flex:0 0 96px;border:2px solid transparent;border-radius:12px;background:var(--surface);padding:4px;text-align:left}
.pick[aria-pressed="true"]{border-color:var(--accent)}
.pick .ph{aspect-ratio:1}
.pick span{display:block;font-size:.75rem;line-height:1.2;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.outfits{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.ocard .board{max-width:none}
.meas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.meas div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meas b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:40;font-size:.9rem;max-width:90vw}
.verdict{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Agregar prenda">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="placar" aria-current="true"><span class="ic">🧺</span>Placar</button>
  <button data-tab="armar"><span class="ic">🪡</span>Armar</button>
  <button data-tab="outfits"><span class="ic">👗</span>Outfits</button>
  <button data-tab="medidas"><span class="ic">📏</span>Medidas</button>
</nav>
<datalist id="fibras">
  <option value="Algodón"><option value="Algodón orgánico"><option value="Lino"><option value="Lana"><option value="Lana merino"><option value="Seda"><option value="Cashmere"><option value="Alpaca"><option value="Cáñamo"><option value="Cuero"><option value="Gamuza"><option value="Viscosa"><option value="Modal"><option value="Lyocell / Tencel"><option value="Poliéster"><option value="Poliéster reciclado"><option value="Poliamida / Nylon"><option value="Acrílico"><option value="Elastano"><option value="Poliuretano / Cuerina"><option value="Caucho">
</datalist>
<script>
"use strict";
const CATS=[["arriba","Arriba"],["abajo","Abajo"],["enteros","Vestidos y enteritos"],["abrigos","Abrigos"],["calzado","Calzado"],["accesorios","Accesorios"]];
const TEMPS=[["verano","Verano"],["otono","Otoño"],["invierno","Invierno"],["primavera","Primavera"]];
const ABRIGO=[["liviano","Liviana"],["medio","Media"],["abrigado","Abrigada"]];
const ESTADO=[["amo","La amo"],["cumple","Cumple"],["reemplazar","A reemplazar"]];
const CALCE=[["perfecto","Me queda perfecto"],["bien","Me queda bien"],["ajustar","Hay que ajustarla"]];
const MEDIDAS=[["altura","Altura","cm"],["busto","Busto","cm"],["bajobusto","Bajo busto","cm"],["cintura","Cintura","cm"],["cadera","Cadera","cm"],["hombros","Ancho de hombros","cm"],["brazo","Largo de brazo","cm"],["entrepierna","Entrepierna","cm"],["tiro","Largo de tiro","cm"],["calzado","Calzado","talle"],["pie","Largo de pie","cm"]];
const lbl=(list,v)=>(list.find(x=>x[0]===v)||[,v])[1];
const NAT=["algod","lino","lana","merino","seda","cashmere","cachemir","alpaca","mohair","cáñamo","canamo","yute","cuero","gamuza"];
const SEMI=["viscosa","rayon","rayón","modal","lyocell","tencel","cupro","bambú","bambu"];
const SINT=["poliést","poliest","acríl","acril","nylon","poliamid","elastan","spandex","lycra","polipropil","poliuret","cuerina","pvc","caucho"];
function fiberClass(f){f=(f||"").toLowerCase();if(SINT.some(s=>f.includes(s)))return"sint";if(SEMI.some(s=>f.includes(s)))return"semi";if(NAT.some(s=>f.includes(s)))return"nat";return"otro";}
function pctOf(it,cls){const c=it.composicion||[];if(!c.length)return null;const tot=c.reduce((a,x)=>a+(+x.pct||0),0)||100;return Math.round(c.filter(x=>fiberClass(x.fibra)===cls).reduce((a,x)=>a+(+x.pct||0),0)*100/tot);}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,"");
const FOTOS=new Map();
const imgSrc=it=>it.foto?(FOTOS.get(it.foto)||""):(it.fotoData||"");

const S={items:[],outfits:[],medidas:{actual:{},historial:[]},tab:"placar",cat:"todas",temp:"todas",show:"todo",armado:[],armTemp:"todas"};
let ready=false;

/* ---------- datos: todo queda en este celular (IndexedDB) ---------- */
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("placar",1);
    r.onupgradeneeded=()=>{const d=r.result;["prendas","outfits","perfil","fotos"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n);});};
    r.onsuccess=()=>{IDB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  write(st,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(st,"readwrite");fn(t.objectStore(st));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(st,k,v){return IDB.write(st,s=>s.put(v,k));},
  del(st,k){return IDB.write(st,s=>s.delete(k));},
  clear(st){return IDB.write(st,s=>s.clear());},
  all(st){return new Promise((res,rej)=>{const out=[];const c=IDB.db.transaction(st).objectStore(st).openCursor();
    c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue();}else res(out);};c.onerror=()=>rej(c.error);});}
};
function sortItems(a){const o=Object.fromEntries(CATS.map((c,i)=>[c[0],i]));return a.sort((x,y)=>(o[x.categoria]??9)-(o[y.categoria]??9)||(y.creado||0)-(x.creado||0));}
function sortOutfits(a){return a.sort((x,y)=>(y.creado||0)-(x.creado||0));}
function upsertLocal(arr,id,data){const i=arr.findIndex(x=>x.id===id);const v={...data,id};if(i<0)arr.push(v);else arr[i]=v;}
const store={
  async setItem(id,data){await IDB.put("prendas",id,data);upsertLocal(S.items,id,data);sortItems(S.items);render();},
  async delItem(id){await IDB.del("prendas",id);S.items=S.items.filter(x=>x.id!==id);render();},
  async setOutfit(id,data){await IDB.put("outfits",id,data);upsertLocal(S.outfits,id,data);sortOutfits(S.outfits);render();},
  async delOutfit(id){await IDB.del("outfits",id);S.outfits=S.outfits.filter(x=>x.id!==id);render();},
  async setMedidas(data){await IDB.put("perfil","medidas",data);S.medidas=data;render();},
  async putFoto(blob){const id=uid();await IDB.put("fotos",id,blob);FOTOS.set(id,URL.createObjectURL(blob));return id;},
  async delFoto(id){await IDB.del("fotos",id);const u=FOTOS.get(id);if(u)URL.revokeObjectURL(u);FOTOS.delete(id);}
};
async function loadAll(){
  const [p,o,f,m]=await Promise.all(["prendas","outfits","fotos","perfil"].map(n=>IDB.all(n)));
  FOTOS.forEach(u=>URL.revokeObjectURL(u));FOTOS.clear();
  f.forEach(([id,b])=>FOTOS.set(id,URL.createObjectURL(b)));
  S.items=sortItems(p.map(([id,v])=>({...v,id})));
  S.outfits=sortOutfits(o.map(([id,v])=>({...v,id})));
  const med=m.find(([k])=>k==="medidas");S.medidas=med?med[1]:{actual:{},historial:[]};
}
async function init(){
  try{await IDB.open();await loadAll();}
  catch(e){S.error="No pude abrir el almacenamiento del navegador. Si estás en modo incógnito, abrí la app en una pestaña normal.";}
  ready=true;render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* ---------- backup ---------- */
const lastBackup=()=>{try{return +localStorage.getItem("ultimoBackup")||0;}catch(e){return 0;}};
async function exportBackup(){
  const fotos={};for(const [id,b] of await IDB.all("fotos"))fotos[id]=await blobToDataURL(b);
  const data={app:"placar",version:1,fecha:new Date().toISOString(),prendas:S.items,outfits:S.outfits,medidas:S.medidas,fotos};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="placar-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  try{localStorage.setItem("ultimoBackup",Date.now());}catch(e){}
}
async function importBackup(file){
  const d=JSON.parse(await file.text());
  if(!d||d.app!=="placar")throw new Error("formato");
  for(const st of ["prendas","outfits","fotos","perfil"])await IDB.clear(st);
  for(const [id,durl] of Object.entries(d.fotos||{}))await IDB.put("fotos",id,await (await fetch(durl)).blob());
  for(const it of d.prendas||[]){const {id,...v}=it;await IDB.put("prendas",id,v);}
  for(const o of d.outfits||[]){const {id,...v}=o;await IDB.put("outfits",id,v);}
  if(d.medidas)await IDB.put("perfil","medidas",d.medidas);
  await loadAll();S.armado=[];render();
}
function backupSheet(){
  const lb=lastBackup();
  openSheet("Backup",`<p>Todo lo que cargás queda guardado solo en este celular, dentro del navegador. Si borrás los datos del navegador o cambiás de teléfono, se pierde, salvo que tengas un backup.</p>
   <p class="muted small">${lb?"Último backup: "+new Date(lb).toLocaleDateString("es-AR"):"Todavía no hiciste ningún backup."}</p>
   <div class="note" style="margin-top:16px"><strong>Descargar backup</strong><p class="small muted" style="margin:4px 0 10px">Baja un archivo con todas tus prendas, fotos, outfits y medidas. Guardalo en Drive, en la compu o mandátelo por mail.</p><button class="btn" id="bexp">Descargar backup</button></div>
   <div class="note" style="margin-top:12px"><strong>Restaurar un backup</strong><p class="small muted" style="margin:4px 0 10px">Reemplaza todo lo que hay ahora en la app por lo que tiene el archivo.</p><label class="btn ghost filebtn">Elegir archivo<input type="file" accept=".json,application/json" id="bimp"></label></div>
   <p class="small" id="bmsg" style="margin-top:12px"></p>`,el=>{
    const m=el.querySelector("#bmsg");
    el.querySelector("#bexp").onclick=async()=>{m.innerHTML='<span class="spin"></span> Preparando…';try{await exportBackup();m.textContent="Listo. Fijate en Descargas.";}catch(e){m.textContent="No se pudo generar el backup.";}};
    const inp=el.querySelector("#bimp");
    inp.onchange=async()=>{const f=inp.files[0];inp.value="";if(!f)return;
      if(!await confirmBox("Esto reemplaza todo lo que tenés cargado ahora por el contenido del backup.","Restaurar"))return;
      m.innerHTML='<span class="spin"></span> Restaurando…';
      try{await importBackup(f);m.textContent="Backup restaurado.";}catch(e){m.textContent="Ese archivo no es un backup del placar o está dañado.";}};
  });
}

/* ---------- UI helpers ---------- */
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function openSheet(title,html,onMount){
  const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="sheet-bar"><button class="icon-btn" data-close aria-label="Cerrar">✕</button><h2>${esc(title)}</h2></div><div class="sheet-body">${html}</div>`;
  document.body.appendChild(el);document.body.classList.add("locked");
  el.querySelector("[data-close]").onclick=()=>closeSheet(el);
  onMount&&onMount(el);return el;
}
function closeSheet(el){el.remove();if(!document.querySelector(".sheet"))document.body.classList.remove("locked");}
function confirmBox(msg,ok){return new Promise(res=>{const el=openSheet("Confirmar",`<p>${esc(msg)}</p><div class="row" style="margin-top:20px"><button class="btn warn" data-y>${esc(ok)}</button><button class="btn ghost" data-n>Cancelar</button></div>`,el=>{
  el.querySelector("[data-y]").onclick=()=>{closeSheet(el);res(true)};el.querySelector("[data-n]").onclick=()=>{closeSheet(el);res(false)};el.querySelector("[data-close]").onclick=()=>{closeSheet(el);res(false)};});});}
function chipsHTML(field,list,sel,multi){sel=[].concat(sel||[]);return `<div class="chips" data-field="${field}" data-multi="${multi?1:0}">${list.map(([v,t])=>`<button type="button" class="chip" data-v="${v}" aria-pressed="${sel.includes(v)}">${esc(t)}</button>`).join("")}</div>`;}
function wireChips(root){root.querySelectorAll(".chips[data-field]").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  if(g.dataset.multi==="1")b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");
  else g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b&&b.getAttribute("aria-pressed")!=="true"));}));}
function readChips(root,field){return [...root.querySelectorAll(`.chips[data-field="${field}"] [aria-pressed="true"]`)].map(b=>b.dataset.v);}
function compLabel(it){const c=(it.composicion||[]).filter(x=>x.fibra);if(!c.length)return `<span class="label empty">Sin composición</span>`;return `<span class="label">${c.map(x=>esc((x.pct?x.pct+"% ":"")+x.fibra)).join(" / ")}</span>`;}
function thumb(it){const s=imgSrc(it);return s?`<img src="${esc(s)}" alt="" loading="lazy">`:`<div class="sw" style="background:${esc(it.colorHex||"#999")}"></div>`;}
/* ---------- tablero de outfit ---------- */
function board(ids,mini){
  const its=ids.map(id=>S.items.find(i=>i.id===id)).filter(Boolean);
  const z={top:[],bottom:[],side:[],feet:[],acc:[]};
  its.forEach(i=>{({arriba:z.top,enteros:z.top,abajo:z.bottom,abrigos:z.side,calzado:z.feet,accesorios:z.acc})[i.categoria]?.push(i);});
  const one=its.some(i=>i.categoria==="enteros")&&!z.bottom.length;
  const zone=(k)=>`<div class="z z-${k}">${z[k].map(thumb).join("")}</div>`;
  return `<div class="board${mini?" mini":""}${one?" one-piece":""}">${["top","bottom","side","feet","acc"].map(zone).join("")}</div>`;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab));
  document.getElementById("fab").hidden=S.tab!=="placar";
  const v=document.getElementById("view");
  if(!ready){v.innerHTML=`<p class="muted"><span class="spin"></span> Abriendo el placar…</p>`;return;}
  if(S.error){v.innerHTML=`<div class="banner">${esc(S.error)}</div>`;return;}
  const viejo=S.items.length>=3&&Date.now()-lastBackup()>30*864e5;
  const banner=viejo&&S.tab==="placar"?`<div class="banner spread"><span>${lastBackup()?"Hace más de un mes que no hacés backup.":"Todavía no hiciste un backup."}</span><button class="btn ghost small" data-act="backup">Hacerlo</button></div>`:"";
  v.innerHTML=banner+({placar:vPlacar,armar:vArmar,outfits:vOutfits,medidas:vMedidas})[S.tab]();
}
function filtered(){
  const enOut=new Set(S.outfits.flatMap(o=>o.prendas||[]));

    &&(S.show==="todo"||(S.show==="sinoutfit"&&!enOut.has(i.id))||(S.show==="reemplazar"&&i.estado==="reemplazar")||(S.show==="sint"&&(pctOf(i,"sint")||0)>50)));
}

}

/* ---------- eventos globales ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;render();window.scrollTo(0,0);});

document.getElementById("view").addEventListener("click",async e=>{

  if(t.dataset.pick){const id=t.dataset.pick;S.armado=S.armado.includes(id)?S.armado.filter(x=>x!==id):[...S.armado,id];render();return;}

  if(t.dataset.load){const o=S.outfits.find(x=>x.id===t.dataset.load);if(o){S.armado=[...(o.prendas||[])];S.editingOutfit=o.id;S.tab="armar";render();window.scrollTo(0,0);}return;}
  if(t.dataset.delout){if(await confirmBox("¿Borrar este outfit? Las prendas quedan en el placar.","Borrar outfit"))store.delOutfit(t.dataset.delout).catch(()=>toast("No se pudo borrar."));return;}
  const a=t.dataset.act;
  if(a==="add")itemForm();

/* ---------- detalle ---------- */

  const tags=[lbl(CATS,it.categoria),...(it.temporadas||[]).map(t=>lbl(TEMPS,t)),it.abrigo&&("Abrigo: "+lbl(ABRIGO,it.abrigo).toLowerCase()),it.estado&&lbl(ESTADO,it.estado),it.calce&&lbl(CALCE,it.calce),it.talle&&("Talle "+it.talle),it.marca].filter(Boolean);

   <div style="margin-top:14px">${compLabel(it)}</div>
   <div class="tags" style="margin-top:12px">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${it.colores?`<span class="tag">${esc(it.colores)}</span>`:""}</div>
   ${it.notas?`<p class="note small" style="margin-top:12px">${esc(it.notas)}</p>`:""}
   <div class="row" style="margin-top:18px">
     <button class="btn ghost" data-x="arm">Llevar al armador</button>
     <button class="btn ghost" data-x="edit">Editar</button>

   <h3 style="margin-top:24px">${outs.length?`Está en ${outs.length} outfit${outs.length>1?"s":""}`:"Todavía no está en ningún outfit"}</h3>

   <button class="btn warn" data-x="del" style="margin-top:28px">Borrar prenda</button>`,el=>{
    el.addEventListener("click",async e=>{const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x;
      if(x==="edit"){closeSheet(el);itemForm(it);}
      else if(x==="arm"){if(!S.armado.includes(id))S.armado.push(id);S.tab="armar";closeSheet(el);render();window.scrollTo(0,0);}
      else if(x==="del"){if(!await confirmBox(`¿Borrar "${it.nombre}"? También se saca de los outfits donde está.`,"Borrar prenda"))return;
        try{await deleteItem(it);closeSheet(el);toast("Prenda borrada");}catch(err){toast("No se pudo borrar.");}}
    });
  });
}
async function deleteItem(it){
  for(const o of S.outfits.filter(o=>(o.prendas||[]).includes(it.id))){
    const pr=o.prendas.filter(x=>x!==it.id);
    if(pr.length)await store.setOutfit(o.id,{nombre:o.nombre,notas:o.notas||"",prendas:pr,creado:o.creado||Date.now()});else await store.delOutfit(o.id);
  }
  await store.delItem(it.id);
  S.armado=S.armado.filter(x=>x!==it.id);
  if(it.foto){try{await store.delFoto(it.foto);}catch(e){}}
}

/* ---------- formulario de prenda + editor de foto ---------- */

  <div class="row field" style="flex-wrap:nowrap"><div style="flex:1"><label for="talle" class="lb">Talle</label><input type="text" id="talle" value="${esc(it.talle)}"></div><div style="flex:2"><label for="marca" class="lb">Marca</label><input type="text" id="marca" value="${esc(it.marca)}"></div></div>

          temporadas:readChips(el,"temporadas"),abrigo:readChips(el,"abrigo")[0]||"",calce:readChips(el,"calce")[0]||"",estado:readChips(el,"estado")[0]||"",

function compRow(x){return `<div class="comp-row"><input type="text" name="f" list="fibras" placeholder="Fibra" value="${esc(x.fibra)}"><input type="number" name="p" min="0" max="100" inputmode="numeric" placeholder="%" value="${esc(x.pct??"")}"><button type="button" class="icon-btn" data-rm aria-label="Quitar fibra">✕</button></div>`;}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
async function loadImg(file){
  if(window.createImageBitmap){try{const b=await createImageBitmap(file,{imageOrientation:"from-image"});return{src:b,naturalWidth:b.width,naturalHeight:b.height};}catch(e){}}
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});return{src:img,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight};}
  finally{setTimeout(()=>URL.revokeObjectURL(url),1000);}
}
async function prepImage(file,max){const img=await loadImg(file);const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img.src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.85));}

function photoEditor(root){
  const box=root.querySelector("#ed"),ctl=root.querySelector("#edctl"),inp=root.querySelector("#photo");
  let cv=null,ctx=null,orig=null,undo=[],tap=false,loaded=false;
  const tol=()=>+root.querySelector("#tol").value;
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const img=await loadImg(f);const k=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
      cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
      ctx=cv.getContext("2d",{willReadFrequently:true});ctx.drawImage(img.src,0,0,cv.width,cv.height);
      orig=ctx.getImageData(0,0,cv.width,cv.height);undo=[];loaded=true;
      box.innerHTML="";box.appendChild(cv);ctl.hidden=false;
      cv.addEventListener("click",e=>{if(!tap)return;const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*cv.width),y=Math.floor((e.clientY-r.top)/r.height*cv.height);erase([y*cv.width+x],null);});
    }catch(e){box.innerHTML=`<p class="small" style="text-align:center;color:var(--warn)">No pude abrir esa imagen${f.type?" ("+esc(f.type)+")":""}. Si es de iPhone en formato HEIC, probá con una captura de pantalla de la foto o cambiá en Ajustes › Cámara › Formatos a "Más compatible".</p>`;}finally{inp.value="";}};
  function push(d){undo.push(new Uint8ClampedArray(d.data));if(undo.length>6)undo.shift();}
  function erase(seeds,ref){
    const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h),o=orig.data;push(d);
    if(!ref){const i=seeds[0]*4;ref=[o[i],o[i+1],o[i+2]];}
    const t2=tol()*tol()*3,seen=new Uint8Array(w*h),st=[];
    const ok=p=>{const i=p*4,a=o[i]-ref[0],b=o[i+1]-ref[1],c=o[i+2]-ref[2];return a*a+b*b+c*c<t2;};
    for(const p of seeds)if(!seen[p]){seen[p]=1;if(ok(p))st.push(p);}
    const q=p=>{if(!seen[p]){seen[p]=1;if(ok(p))st.push(p);}};
    while(st.length){const p=st.pop();d.data[p*4+3]=0;const x=p%w;if(x>0)q(p-1);if(x<w-1)q(p+1);if(p>=w)q(p-w);if(p<w*(h-1))q(p+w);}
    // suavizar borde
    const A=new Uint8Array(w*h);for(let p=0;p<w*h;p++)A[p]=d.data[p*4+3];
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(A[p]===255&&(!A[p-1]||!A[p+1]||!A[p-w]||!A[p+w]))d.data[p*4+3]=170;}
    ctx.putImageData(d,0,0);
  }
  root.querySelector("#auto").onclick=()=>{if(!loaded)return;const w=cv.width,h=cv.height,o=orig.data;let r=0,g=0,b=0,n=0;const seeds=[];
    const add=(x,y)=>{const p=y*w+x,i=p*4;r+=o[i];g+=o[i+1];b+=o[i+2];n++;seeds.push(p);};
    for(let x=0;x<w;x++){add(x,0);add(x,h-1);}for(let y=1;y<h-1;y++){add(0,y);add(w-1,y);}
    erase(seeds,[r/n,g/n,b/n]);};
  root.querySelector("#tapmode").onclick=e=>{tap=!tap;e.currentTarget.setAttribute("aria-pressed",tap);box.classList.toggle("tap",tap);};
  root.querySelector("#undo").onclick=()=>{if(!undo.length)return;const d=ctx.getImageData(0,0,cv.width,cv.height);d.data.set(undo.pop());ctx.putImageData(d,0,0);};
  root.querySelector("#reset").onclick=()=>{if(!loaded)return;push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(orig,0,0);};
  return{
    hasImage:()=>loaded,
    async exportBlob(max){
      const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
      if(x1<0){x0=0;y0=0;x1=w-1;y1=h-1;}
      const cw=x1-x0+1,ch=y1-y0+1,k=Math.min(1,max/Math.max(cw,ch));
      const out=document.createElement("canvas");out.width=Math.max(1,Math.round(cw*k));out.height=Math.max(1,Math.round(ch*k));
      const oc=out.getContext("2d");oc.drawImage(cv,x0,y0,cw,ch,0,0,out.width,out.height);
      // color dominante
      const px=oc.getImageData(0,0,out.width,out.height).data,bins={};let best=null,bc=0;
      for(let i=0;i<px.length;i+=16){if(px[i+3]<200)continue;const k2=(px[i]>>4)+","+(px[i+1]>>4)+","+(px[i+2]>>4);bins[k2]=(bins[k2]||0)+1;if(bins[k2]>bc){bc=bins[k2];best=k2;}}
      const color=best?"#"+best.split(",").map(v=>((+v<<4)+8).toString(16).padStart(2,"0")).join(""):null;
      const blob=await new Promise(res=>out.toBlob(b=>{if(b&&b.type==="image/webp")res(b);else out.toBlob(res,"image/png");},"image/webp",.85));
      return{blob,color};
    }
  };
}

/* ---------- outfits ---------- */
function saveOutfitSheet(ids,editId,presetIdea){
  const cur=editId?S.outfits.find(o=>o.id===editId):null;
  openSheet(cur?"Guardar cambios del outfit":"Guardar outfit",`${board(ids)}
   <div class="field"><label for="on">Nombre</label><input type="text" id="on" placeholder="Oficina de invierno" value="${esc(cur?cur.nombre:"")}"></div>
   <div class="field"><label for="onotas">Notas</label><textarea id="onotas" placeholder="Para qué ocasión, con qué abrigo…">${esc(cur?cur.notas:(presetIdea||""))}</textarea></div>
   <div class="row" style="margin-top:20px"><button class="btn" id="osave">Guardar</button>${cur?`<button class="btn ghost" id="onew">Guardar como nuevo</button>`:""}</div>`,el=>{
    const go=async(id)=>{const nombre=el.querySelector("#on").value.trim()||"Outfit sin nombre";
      try{await store.setOutfit(id,{nombre,notas:el.querySelector("#onotas").value.trim(),prendas:[...ids],creado:(cur&&id===cur.id&&cur.creado)||Date.now()});closeSheet(el);toast("Outfit guardado");if(ids===S.armado){S.armado=[];S.editingOutfit=null;render();}}
      catch(e){toast("No se pudo guardar el outfit.");}};
    el.querySelector("#osave").onclick=()=>go(cur?cur.id:uid());
    const n=el.querySelector("#onew");if(n)n.onclick=()=>go(uid());
  });
}
/* ---------- medidas ---------- */
function medSheet(){
  const a=S.medidas.actual||{};
  openSheet("Mis medidas",`<p class="muted small">En centímetros. Cada vez que guardás queda registrado, así ves cómo van cambiando.</p>
   <div class="meas">${MEDIDAS.map(([k,t,u])=>`<div><label for="m_${k}" class="small muted">${t} (${u})</label><input type="${k==="calzado"?"text":"number"}" step="0.5" inputmode="decimal" id="m_${k}" value="${esc(a[k]??"")}"></div>`).join("")}</div>
   <div class="field"><label for="m_notas">Notas de calce</label><textarea id="m_notas" placeholder="Los pantalones me quedan largos, prefiero tiro alto…">${esc(a.notas||"")}</textarea></div>
   <div class="row" style="margin-top:20px"><button class="btn" id="msave">Guardar medidas</button></div>`,el=>{
    el.querySelector("#msave").onclick=async()=>{
      const v={};MEDIDAS.forEach(([k])=>{const x=el.querySelector("#m_"+k).value.trim();if(x)v[k]=k==="calzado"?x:+x;});
      const notas=el.querySelector("#m_notas").value.trim();
      const fecha=new Date().toLocaleDateString("es-AR");
      const hist=[...(S.medidas.historial||[])];const last=hist[hist.length-1];
      if(last&&last.fecha===fecha)hist[hist.length-1]={fecha,valores:v};else hist.push({fecha,valores:v});
      try{await store.setMedidas({actual:{...v,notas},historial:hist.slice(-24)});closeSheet(el);toast("Medidas guardadas");}
      catch(e){toast("No se pudieron guardar las medidas.");}
    };
  });
}

render();init();
